<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DI naujienų reelsas</title>
<meta name="description" content="Animuotas reelsas apie svarbiausias dirbtinio intelekto naujienas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #0b0d14;
    --text: #f5f6fa;
    --muted: rgba(245, 246, 250, .72);
    --chip: rgba(255, 255, 255, .14);
    --bar: rgba(255, 255, 255, .28);
    --bar-fill: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--page-bg);
    color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* 9:16 reels kortelė */
  .reel {
    position: relative;
    width: min(100vw, calc(100vh * 9 / 16));
    height: min(100vh, calc(100vw * 16 / 9));
    max-height: 100vh;
    border-radius: 22px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
    isolation: isolate;
  }

  /* Progreso juostos (kaip stories) */
  .bars {
    position: absolute; z-index: 5; top: 14px; left: 14px; right: 14px;
    display: flex; gap: 5px;
  }
  .bar { flex: 1; height: 3px; border-radius: 3px; background: var(--bar); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--bar-fill); }
  .bar.done i { width: 100%; }

  .topline {
    position: absolute; z-index: 5; top: 28px; left: 16px; right: 16px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 500;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand b {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12px;
    background: linear-gradient(135deg, #ff5f6d, #7b5cff);
  }
  .ctrl {
    background: var(--chip); border: 0; color: var(--text);
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    font-size: 14px; backdrop-filter: blur(6px);
  }

  /* Skaidrės */
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 90px 26px 70px;
    opacity: 0; visibility: hidden;
    transition: opacity .5s ease, visibility .5s;
  }
  .slide.active { opacity: 1; visibility: visible; }

  .bg {
    position: absolute; inset: -20%; z-index: -2;
    background: var(--grad);
    background-size: 200% 200%;
    animation: drift 14s ease-in-out infinite alternate;
  }
  .slide::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(0,0,0,.25) 0%, transparent 35%, rgba(0,0,0,.55) 100%);
  }
  .orb {
    position: absolute; z-index: -1; border-radius: 50%;
    filter: blur(40px); opacity: .55; mix-blend-mode: screen;
  }
  .orb.a { width: 60%; aspect-ratio: 1; top: 8%; left: -15%; background: var(--o1); animation: float 9s ease-in-out infinite; }
  .orb.b { width: 50%; aspect-ratio: 1; top: 30%; right: -15%; background: var(--o2); animation: float 11s ease-in-out infinite reverse; }

  .icon {
    font-size: clamp(64px, 22vmin, 120px);
    line-height: 1; margin-bottom: auto; margin-top: 40px;
    align-self: center;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,.35));
  }
  .tag {
    align-self: flex-start;
    font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    background: var(--chip); padding: 6px 12px; border-radius: 99px;
    backdrop-filter: blur(6px); margin-bottom: 14px;
  }
  .stat {
    font-size: clamp(44px, 13vmin, 76px); font-weight: 700; line-height: 1;
    margin-bottom: 10px; font-variant-numeric: tabular-nums;
  }
  h2 {
    font-size: clamp(24px, 6.4vmin, 34px); line-height: 1.12; font-weight: 700;
    margin-bottom: 12px; text-wrap: balance;
  }
  h2 .w { display: inline-block; }
  p.lead { font-size: clamp(15px, 3.8vmin, 18px); line-height: 1.45; color: var(--muted); }
  .meta { margin-top: 16px; font-size: 12px; color: var(--muted); }

  /* Įėjimo animacijos – paleidžiamos tik aktyvioje skaidrėje */
  .slide .icon, .slide .tag, .slide .stat, .slide h2 .w, .slide p.lead, .slide .meta { opacity: 0; }
  .slide.active .icon { animation: pop .8s cubic-bezier(.2,1.4,.4,1) .1s forwards, bob 4s ease-in-out 1s infinite; }
  .slide.active .tag  { animation: rise .6s ease .25s forwards; }
  .slide.active .stat { animation: rise .6s ease .35s forwards; }
  .slide.active h2 .w { animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(.45s + var(--i) * 55ms); }
  .slide.active p.lead { animation: rise .7s ease 1s forwards; }
  .slide.active .meta { animation: rise .7s ease 1.3s forwards; }

  @keyframes rise { from { opacity: 0; transform: translateY(22px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes pop  { from { opacity: 0; transform: scale(.3) rotate(-15deg); } to { opacity: 1; transform: none; } }
  @keyframes bob  { 50% { transform: translateY(-10px) rotate(3deg); } }
  @keyframes drift { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
  @keyframes float { 50% { transform: translate(12%, -10%) scale(1.1); } }

  .reel.paused .slide *, .reel.paused .bg, .reel.paused .orb { animation-play-state: paused !important; }

  /* Paspaudimo zonos */
  .tap { position: absolute; z-index: 4; top: 70px; bottom: 0; width: 35%; cursor: pointer; }
  .tap.prev { left: 0; } .tap.next { right: 0; width: 65%; }

  .hint {
    position: absolute; z-index: 5; bottom: 22px; left: 0; right: 0;
    text-align: center; font-size: 12px; color: var(--muted);
  }

  @media (max-width: 480px) { .reel { border-radius: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .bg, .orb, .slide.active .icon { animation: none !important; }
    .slide.active .icon, .slide.active .tag, .slide.active .stat,
    .slide.active h2 .w, .slide.active p.lead, .slide.active .meta { animation: none !important; opacity: 1; }
  }
</style>
</head>
<body>
<main class="reel" id="reel" aria-roledescription="carousel" aria-label="DI naujienos">
  <div class="bars" id="bars"></div>
  <div class="topline">
    <div class="brand"><b>DI</b> DI naujienos · spalis 2026</div>
    <button class="ctrl" id="toggle" aria-label="Pauzė">❚❚</button>
  </div>
  <div id="slides"></div>
  <div class="tap prev" data-dir="-1" aria-hidden="true"></div>
  <div class="tap next" data-dir="1" aria-hidden="true"></div>
  <div class="hint">Bakstelėk ← → · laikyk – pauzė</div>
</main>

<script>
// Naujienų turinys – redaguokite šį masyvą norėdami atnaujinti reelsą.
// stat: { to, prefix, suffix, decimals } – skaičius animuojamas nuo 0.
const NEWS = [
  {
    intro: true, icon: "🤖", tag: "Savaitės apžvalga",
    title: "5 svarbiausios DI naujienos per 60 sekundžių",
    lead: "Modeliai, valstybių partnerystės ir verslo sprendimai – viskas, ką verta žinoti šį mėnesį.",
    grad: "linear-gradient(135deg,#1b1f3b,#5b2bff,#ff3d77)", o1: "#ff3d77", o2: "#00d4ff"
  },
  {
    icon: "🇸🇬", tag: "Valdžia", date: "Spalio 16 d.",
    title: "Singapūras pradeda DI partnerystę su Anthropic",
    lead: "Viešasis sektorius diegs Claude modelius valstybės paslaugoms ir tarnautojų darbui palengvinti.",
    source: "AI News",
    grad: "linear-gradient(160deg,#3a0a1e,#c8102e,#ff8a5c)", o1: "#ffd1a8", o2: "#ff2e63"
  },
  {
    icon: "🏭", tag: "Pramonė", date: "Spalio 20 d.",
    title: "Vokietija ir NVIDIA pasirašė pramoninio DI deklaraciją",
    lead: "Berlyne sutarta stiprinti DI infrastruktūrą Europos gamyboje – nuo gamyklų skaitmeninių dvynių iki robotikos.",
    source: "AI News",
    grad: "linear-gradient(150deg,#0b2b12,#2f8f2f,#9be15d)", o1: "#76ff03", o2: "#00e5a0"
  },
  {
    icon: "📡", tag: "Verslas", date: "Spalio 6 d.",
    stat: { to: 2.5, prefix: "€", suffix: " mlrd.", decimals: 1 },
    title: "Deutsche Telekom sutaupymų tikslą sieja su DI",
    lead: "Telekomunikacijų milžinas tikisi didelę dalį išlaidų mažinti automatizuodamas procesus dirbtiniu intelektu.",
    source: "Mean CEO naujienų apžvalga",
    grad: "linear-gradient(150deg,#2a0033,#e20074,#ff7ac6)", o1: "#ff9de2", o2: "#7b2cff"
  },
  {
    icon: "⚡", tag: "Modeliai", date: "Spalis",
    title: "Anthropic pristatė Claude Haiku 5.5",
    lead: "Naujas greitasis Claude 5 šeimos modelis – spartesnis ir pigesnis, skirtas masiniam DI naudojimui programose.",
    source: "Anthropic",
    grad: "linear-gradient(150deg,#2b1708,#d97742,#f5c48a)", o1: "#ffe0b2", o2: "#ff7043"
  },
  {
    icon: "🕵️", tag: "Tyrimai", date: "Spalio 1 d.",
    stat: { to: 98, prefix: "~", suffix: "%" },
    title: "UCLA DI sistema atpažįsta deepfake vaizdo įrašus",
    lead: "Mokslininkų sukurtas modelis suklastotą turinį aptinka beveik 98 % tikslumu – svarbus žingsnis kovoje su dezinformacija.",
    source: "ScienceDaily",
    grad: "linear-gradient(150deg,#021b33,#0a5cff,#33e1ff)", o1: "#80f0ff", o2: "#3d5afe"
  },
  {
    outro: true, icon: "🚀", tag: "Iki kitos savaitės",
    title: "Sek DI naujienas kartu su mumis",
    lead: "Turite klausimų apie DI sprendimus savo verslui? Paklauskite mūsų pokalbių roboto.",
    grad: "linear-gradient(135deg,#120b2e,#7b5cff,#00d4ff)", o1: "#00d4ff", o2: "#ff3d77"
  }
];

const DURATION = 6500; // ms vienai skaidrei
const reel = document.getElementById("reel");
const barsEl = document.getElementById("bars");
const slidesEl = document.getElementById("slides");
const toggleBtn = document.getElementById("toggle");

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const words = t => t.split(" ").map((w, i) => `<span class="w" style="--i:${i}">${esc(w)}</span>`).join(" ");

NEWS.forEach((n, i) => {
  barsEl.insertAdjacentHTML("beforeend", `<div class="bar"><i></i></div>`);
  slidesEl.insertAdjacentHTML("beforeend", `
    <section class="slide" aria-label="${i + 1} iš ${NEWS.length}"
      style="--grad:${n.grad};--o1:${n.o1};--o2:${n.o2}">
      <div class="bg"></div><div class="orb a"></div><div class="orb b"></div>
      <div class="icon" aria-hidden="true">${n.icon}</div>
      <span class="tag">${esc(n.tag)}${n.date ? " · " + esc(n.date) : ""}</span>
      ${n.stat ? `<div class="stat" data-i="${i}">${esc(n.stat.prefix || "")}0${esc(n.stat.suffix || "")}</div>` : ""}
      <h2>${words(n.title)}</h2>
      <p class="lead">${esc(n.lead)}</p>
      ${n.source ? `<div class="meta">Šaltinis: ${esc(n.source)}</div>` : ""}
    </section>`);
});

const slides = [...slidesEl.children];
const bars = [...barsEl.children];
let current = 0, elapsed = 0, last = 0, paused = false, held = false;

function countUp(i) {
  const el = slides[i].querySelector(".stat");
  if (!el) return;
  const { to, prefix = "", suffix = "", decimals = 0 } = NEWS[i].stat;
  const start = performance.now();
  const fmt = v => prefix + v.toFixed(decimals).replace(".", ",") + suffix;
  (function step(t) {
    const p = Math.min(1, (t - start - 350) / 1200);
    if (p < 0) return requestAnimationFrame(step);
    el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1 && current === i) requestAnimationFrame(step);
  })(start);
}

function go(i) {
  current = (i + NEWS.length) % NEWS.length;
  elapsed = 0;
  slides.forEach((s, k) => s.classList.toggle("active", k === current));
  bars.forEach((b, k) => {
    b.classList.toggle("done", k < current);
    b.firstElementChild.style.width = k < current ? "100%" : "0";
  });
  countUp(current);
}

function setPaused(p) {
  paused = p;
  reel.classList.toggle("paused", p);
  toggleBtn.textContent = p ? "▶" : "❚❚";
  toggleBtn.setAttribute("aria-label", p ? "Tęsti" : "Pauzė");
}

function tick(t) {
  const dt = last ? t - last : 0;
  last = t;
  if (!paused && !held && !document.hidden) {
    elapsed += dt;
    bars[current].firstElementChild.style.width = Math.min(100, elapsed / DURATION * 100) + "%";
    if (elapsed >= DURATION) go(current + 1);
  }
  requestAnimationFrame(tick);
}

// Valdymas: bakstelėjimas, laikymas, braukimas, klaviatūra
let downAt = 0, downX = 0;
document.querySelectorAll(".tap").forEach(z => {
  z.addEventListener("pointerdown", e => { downAt = Date.now(); downX = e.clientX; held = true; });
  z.addEventListener("pointerup", e => {
    held = false;
    const dx = e.clientX - downX;
    if (Math.abs(dx) > 40) return go(current + (dx < 0 ? 1 : -1));
    if (Date.now() - downAt < 250) go(current + Number(z.dataset.dir));
  });
  z.addEventListener("pointerleave", () => { held = false; });
});
toggleBtn.addEventListener("click", () => setPaused(!paused));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(current + 1);
  else if (e.key === "ArrowLeft") go(current - 1);
  else if (e.key === " ") { e.preventDefault(); setPaused(!paused); }
});

go(0);
requestAnimationFrame(tick);
</script>
</body>
</html>
