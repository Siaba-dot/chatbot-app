<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuotraukų vaizdo įrašas</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #05070f; }
  body { display: grid; place-items: center; overflow: hidden; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Nuotraukų vaizdo įrašas: lėtas priartinimas/slinkimas, sklandūs perėjimai,
// šviesos dalelės ir tekstai. Nustatymai – per URL parametrus:
//   photos=a.jpg,b.jpg   nuotraukos (keliai nuo šio failo)
//   title=…  end=…       pradžios ir pabaigos tekstai (neprivalomi)
//   captions=…|…|…       užrašai ant nuotraukų, atskirti „|“ (neprivalomi)
//   focus=0.7,0.5        kur nuotraukoje (0–1 horizontaliai) yra svarbiausia dalis, pvz. veidas
//   per=4                sekundės vienai nuotraukai
//   leaves=1             krentantys rudens lapai
const q = new URLSearchParams(location.search);
const PHOTOS = (q.get("photos") || "").split(",").filter(Boolean);
const CAPTIONS = (q.get("captions") || "").split("|");
const TITLE = q.get("title") || "";
const END = q.get("end") || "";
const FOCUS = (q.get("focus") || "").split(",").map(Number);
const LEAVES = q.has("leaves");

const W = 1080, H = 1920;
const PER = Number(q.get("per")) || 3.6; // sekundės vienai nuotraukai
const FADE = 0.9;  // perėjimo trukmė
const INTRO = TITLE ? 2.6 : 0;
const OUTRO = END ? 3 : 0.6;
const DURATION = INTRO + PHOTOS.length * PER + FADE + OUTRO;

const ctx = document.getElementById("c").getContext("2d");
const { sin, cos, PI, min, max } = Math;
const clamp = (v, a = 0, b = 1) => min(b, max(a, v));
const smooth = (a, b, v) => { const x = clamp((v - a) / (b - a)); return x * x * (3 - 2 * x); };

function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(3);
const leaves = Array.from({ length: LEAVES ? 18 : 0 }, () => ({
  x: R() * W, y: R() * H, s: 22 + R() * 26, spd: 70 + R() * 90, sway: 40 + R() * 70,
  ph: R() * 6.28, spin: (R() - 0.5) * 3, hue: ["#e8742a", "#d9461f", "#f2b33d", "#b8541e", "#f0c75e"][Math.floor(R() * 5)]
}));
const motes = Array.from({ length: LEAVES ? 35 : 55 }, () => ({ x: R() * W, y: R() * H, r: 3 + R() * 14, spd: 15 + R() * 40, ph: R() * 6.28 }));
// Kiekvienai nuotraukai – skirtingas judesio kelias
const moves = PHOTOS.map((_, i) => ({ z0: 1.0 + (i % 2) * 0.12, z1: 1.12 - (i % 2) * 0.12, dx: (R() - 0.5) * 0.08, dy: (R() - 0.5) * 0.06 }));

const images = PHOTOS.map(src => { const im = new Image(); im.src = src; return im; });
const blurred = [];

// Suliejame foną iš anksto – kadrų piešimas tampa greitas
function prepare() {
  images.forEach((im, i) => {
    const c = document.createElement("canvas");
    c.width = W / 4; c.height = H / 4;
    const b = c.getContext("2d");
    b.filter = "blur(18px) brightness(0.55) saturate(1.2)";
    drawCover(b, im, c.width, c.height, 1.25, 0, 0);
    blurred[i] = c;
  });
}

// Užpildo plotą; fx – horizontalus fokuso taškas (0–1), kuris laikomas kadre
function drawCover(c, im, w, h, zoom, dx, dy, fx = 0.5) {
  const s = max(w / im.width, h / im.height) * zoom;
  const iw = im.width * s, ih = im.height * s;
  const x = clamp(w / 2 - fx * iw + dx * w, w - iw, 0);
  const y = clamp((h - ih) / 2 + dy * h, h - ih, 0);
  c.drawImage(im, x, y, iw, ih);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawPhoto(i, local, alpha) {
  const im = images[i], m = moves[i];
  const p = clamp(local / (PER + FADE));
  const ease = p * p * (3 - 2 * p);
  const zoom = m.z0 + (m.z1 - m.z0) * ease;
  ctx.save();
  ctx.globalAlpha = alpha;

  // Suliejęs fonas
  ctx.drawImage(blurred[i], 0, 0, W, H);

  const ar = im.width / im.height;
  if (ar <= 0.8) {
    // Vertikali nuotrauka – per visą kadrą
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    drawCover(ctx, im, W, H, zoom, m.dx * ease, m.dy * ease, FOCUS[i] || 0.5);
    ctx.restore();
  } else {
    // Horizontali ar kvadratinė – kortelė ant suliejusio fono
    const cw = W - 100, ch = min(H * 0.62, cw / ar * 1.08);
    const cx = 50, cy = (H - ch) / 2 - 40;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 20;
    roundRect(cx, cy, cw, ch, 28); ctx.fillStyle = "#000"; ctx.fill();
    ctx.restore();
    ctx.save(); roundRect(cx, cy, cw, ch, 28); ctx.clip();
    ctx.translate(cx, cy);
    drawCover(ctx, im, cw, ch, zoom, m.dx * ease, m.dy * ease);
    ctx.restore();
  }

  // Užrašas
  const cap = CAPTIONS[i];
  if (cap) {
    const ca = smooth(0.5, 1.2, local) * (1 - smooth(PER, PER + FADE * 0.6, local));
    ctx.globalAlpha = alpha * ca;
    ctx.font = "84px Pacifico"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 24;
    ctx.fillStyle = "#fff";
    ctx.fillText(cap, W / 2, H - 330 + (1 - ca) * 30, W - 120);
  }
  ctx.restore();
}

function overlay(t) {
  // Vinjetė
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.45)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // Šviesos dalelės
  for (const m of motes) {
    const y = ((m.y - m.spd * t) % (H + 60) + H + 60) % (H + 60) - 30;
    const x = m.x + sin(t * 0.6 + m.ph) * 30;
    const a = 0.12 + 0.18 * (0.5 + 0.5 * sin(t * 1.5 + m.ph));
    const rg = ctx.createRadialGradient(x, y, 0, x, y, m.r);
    rg.addColorStop(0, `rgba(255,236,190,${a})`); rg.addColorStop(1, "rgba(255,236,190,0)");
    ctx.fillStyle = rg; ctx.fillRect(x - m.r, y - m.r, m.r * 2, m.r * 2);
  }
  // Rudens lapai
  for (const l of leaves) {
    const y = (l.y + l.spd * t) % (H + 120) - 60;
    const x = l.x + sin(t * 1.1 + l.ph) * l.sway;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(l.ph + t * l.spin);
    ctx.scale(1, 0.55 + 0.45 * sin(t * 2.2 + l.ph)); // vartosi ore
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = l.hue;
    ctx.beginPath();
    ctx.moveTo(-l.s, 0);
    ctx.quadraticCurveTo(-l.s * 0.2, -l.s * 0.75, l.s, 0);
    ctx.quadraticCurveTo(-l.s * 0.2, l.s * 0.75, -l.s, 0);
    ctx.fill();
    ctx.strokeStyle = "rgba(90,40,10,.55)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-l.s * 1.2, 0); ctx.lineTo(l.s * 0.85, 0); ctx.stroke();
    ctx.restore();
  }
}

function bigText(text, t, t0, t1) {
  const a = smooth(t0, t0 + 0.8, t) * (1 - smooth(t1 - 0.6, t1, t));
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = "120px Pacifico"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(255,225,160,.8)"; ctx.shadowBlur = 40;
  ctx.fillStyle = "#fff";
  const lines = text.split("\n");
  lines.forEach((l, k) => ctx.fillText(l, W / 2, H / 2 + (k - (lines.length - 1) / 2) * 150 + (1 - a) * 30, W - 100));
  ctx.restore();
}

function draw(t) {
  ctx.fillStyle = "#05070f"; ctx.fillRect(0, 0, W, H);
  const last = PHOTOS.length - 1;
  // Sulieta pirmoji nuotrauka po pradžios užrašu, paskutinė – po pabaigos
  if (TITLE && t < INTRO + 1) {
    ctx.globalAlpha = smooth(0, 1, t); ctx.drawImage(blurred[0], 0, 0, W, H); ctx.globalAlpha = 1;
  }
  if (END && t > INTRO + last * PER) { ctx.drawImage(blurred[last], 0, 0, W, H); }
  for (let i = 0; i < PHOTOS.length; i++) {
    const start = INTRO + i * PER;
    const local = t - start;
    if ((i > 0 && local < 0) || local > PER + FADE) continue;
    const fadeIn = i === 0 ? smooth(INTRO - 0.8, INTRO + 0.4, t) : smooth(0, FADE, local);
    const fadeOut = i === last && END ? 1 - smooth(PER, PER + FADE, local) : 1;
    drawPhoto(i, max(0, local), fadeIn * fadeOut);
  }
  overlay(t);
  if (TITLE) bigText(TITLE, t, 0.2, INTRO + 0.3);
  if (END) bigText(END, t, INTRO + PHOTOS.length * PER + 0.3, DURATION + 10);
  else { ctx.fillStyle = `rgba(5,7,15,${smooth(DURATION - 0.6, DURATION, t)})`; ctx.fillRect(0, 0, W, H); }
}

window.DURATION = DURATION;
window.ready = Promise.all([
  document.fonts.load("120px Pacifico"),
  ...images.map(im => im.decode())
]).then(prepare);
window.renderAt = t => draw(t);
if (!q.has("video")) {
  window.ready.then(() => {
    const s = performance.now();
    (function loop(n) { draw(((n - s) / 1000) % DURATION); requestAnimationFrame(loop); })(s);
  });
}
</script>
</body>
</html>
