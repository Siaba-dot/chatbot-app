<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Studijos stilius: gilus mėlynas fonas, gintariniai mygtukai */
  :root { --amber: #E39B2E; --honey: #FFD58A; --ink: #061226; --text: #F3E7D3; --muted: #B4C3D8;
          --panel: rgba(14,34,66,.72); --rec: #FF5A4E; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--text); background: transparent; }
  .box { background: var(--panel); border: 1px solid rgba(227,155,46,.35); border-radius: 14px; padding: 12px;
         box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  video { width: 100%; max-height: 60vh; background: #000; border-radius: 10px; display: none;
          border: 1px solid rgba(227,155,46,.25); }
  video.mirror { transform: scaleX(-1); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { flex: 1 1 auto; min-height: 46px; font-size: 16px; border-radius: 12px;
           border: 1px solid rgba(227,155,46,.45); background: rgba(6,18,38,.6); color: var(--text);
           padding: 8px 12px; cursor: pointer; font-family: inherit; }
  button:active { transform: translateY(1px); }
  button.primary { background: linear-gradient(100deg, #B85F12, #FFD58A 45%, #E39B2E 70%, #B85F12); border: 0;
                   color: var(--ink); font-weight: 600; letter-spacing: .02em; }
  button#stop { background: var(--rec); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .hidden { display: none !important; }
  .msg { margin-top: 8px; font-size: 15px; color: var(--muted); }
  .msg.err { color: #FF8A80; }
  .meter { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .bar { flex: 1; height: 8px; background: rgba(180,195,216,.18); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #E39B2E, #FFD58A); transition: width .08s; }
  .rec { color: var(--rec); font-weight: 600; }
  /* Sufleris: tekstas slenka ant kameros vaizdo */
  .stage { position: relative; }
  .prompt { position: absolute; left: 0; right: 0; top: 0; height: 55%; overflow: hidden; border-radius: 10px 10px 0 0;
            background: linear-gradient(180deg, rgba(6,18,38,.82) 70%, rgba(6,18,38,0)); pointer-events: none; }
  .prompt .txt { padding: 10px 16px 40px; color: #fff; font-weight: 600; line-height: 1.35; text-align: center;
                 text-shadow: 0 1px 3px rgba(0,0,0,.8); will-change: transform; }
  .pctl { position: absolute; right: 6px; bottom: 8px; display: flex; gap: 4px; z-index: 2; }
  .prate { align-self: center; min-width: 34px; text-align: center; font-size: 12px; color: #FFD58A;
           background: rgba(6,18,38,.75); border-radius: 6px; padding: 2px 4px; }
  .pctl button { flex: none; min-height: 30px; padding: 2px 8px; font-size: 13px; border-radius: 8px;
                 background: rgba(6,18,38,.75); }
</style>
</head>
<body>
<div class="box">
  <div class="stage">
    <video id="live" playsinline muted autoplay></video>
    <div id="prompt" class="prompt hidden"><div id="ptext" class="txt"></div></div>
    <div id="pctl" class="pctl hidden">
      <button id="pslow" title="Lėčiau">🐢</button><span id="prate" class="prate">1.0×</span>
      <button id="pfast" title="Greičiau">🐇</button><button id="ppause" title="Sustabdyti / tęsti">⏸</button>
      <button id="psmall" title="Mažesnės raidės">A−</button><button id="pbig" title="Didesnės raidės">A+</button>
      <button id="ptop" title="Iš pradžių">⤒</button>
    </div>
  </div>
  <video id="playback" playsinline controls></video>
  <div id="meterRow" class="meter hidden">🎙️ <div class="bar"><div id="meter"></div></div> <span id="timer"></span></div>
  <div class="row">
    <button id="start" class="primary">🎥 Įjungti kamerą</button>
    <button id="flip" class="hidden">🔄 Kita kamera</button>
    <button id="rec" class="primary hidden">⏺ Pradėti filmuoti</button>
    <button id="stop" class="primary hidden">⏹ Baigti</button>
    <button id="use" class="primary hidden">✅ Pridėti šį įrašą</button>
    <button id="again" class="hidden">↩️ Filmuoti iš naujo</button>
  </div>
  <div id="msg" class="msg">Programa paprašys leidimo naudoti kamerą ir mikrofoną – spauskite „Leisti“.</div>
</div>
<script>
const MAX_SECONDS = 300;
const $ = id => document.getElementById(id);
const live = $("live"), playback = $("playback");
let stream = null, recorder = null, chunks = [], facing = "user", timerId = null, t0 = 0, blob = null, audioCtx = null;

function send(type, extra) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, extra), "*");
}
function resize() { send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 4}); }
function show(ids) {
  ["start", "flip", "rec", "stop", "use", "again"].forEach(id => $(id).classList.toggle("hidden", !ids.includes(id)));
  resize();
}
function say(text, err) { const m = $("msg"); m.textContent = text; m.classList.toggle("err", !!err); resize(); }

window.addEventListener("message", e => { if (e.data && e.data.type === "streamlit:render") resize(); });
new ResizeObserver(resize).observe(document.body);
// ---------- Sufleris ----------
let script = "", pSize = 22, pOff = 0, pLast = 0, pRun = false, pPause = false;
// Greitis pritaikomas tekstui: visas tekstas praslenka per tiek laiko, kiek reikia jį ramiai perskaityti
// (~1,8 žodžio/s). pRate – jūsų pataisa (🐢 / 🐇), įsimenama naršyklėje.
const WPS = 1.8;
let pRate = 1.0;
try { pRate = parseFloat(localStorage.getItem("prompterRate")) || 1.0; } catch (e) { /* be atminties */ }
function promptVisible() {
  const on = !!script && live.style.display === "block";
  $("prompt").classList.toggle("hidden", !on); $("pctl").classList.toggle("hidden", !on);
}
function promptRender() { $("ptext").style.fontSize = pSize + "px"; $("ptext").style.transform = `translateY(${-pOff}px)`; }
function baseSpeed() {  // px/s: teksto aukštis / skaitymo laikas
  const words = Math.max(1, script.trim().split(/\s+/).length);
  const dist = Math.max(40, $("ptext").scrollHeight - $("prompt").clientHeight * 0.45);
  return dist / (words / WPS);
}
function showRate() { $("prate").textContent = pRate.toFixed(1) + "×"; }
function promptTick(ts) {
  if (!pRun) return;
  if (pLast && !pPause) pOff += baseSpeed() * pRate * (ts - pLast) / 1000;
  pLast = ts; promptRender(); requestAnimationFrame(promptTick);
}
function promptStart() {  // 2 s pauzė – spėsite perskaityti pirmą eilutę
  pRun = true; pLast = 0; pPause = false; $("ppause").textContent = "⏸";
  setTimeout(() => { if (pRun) requestAnimationFrame(promptTick); }, 2000);
}
function promptStop() { pRun = false; }
function setRate(r) {
  pRate = Math.round(Math.max(0.3, Math.min(2.5, r)) * 10) / 10; showRate();
  try { localStorage.setItem("prompterRate", String(pRate)); } catch (e) { /* be atminties */ }
}
$("pslow").onclick = () => setRate(pRate - 0.1);
$("pfast").onclick = () => setRate(pRate + 0.1);
$("ppause").onclick = () => { pPause = !pPause; $("ppause").textContent = pPause ? "▶" : "⏸"; };
$("psmall").onclick = () => { pSize = Math.max(14, pSize - 2); promptRender(); resize(); };
$("pbig").onclick = () => { pSize = Math.min(40, pSize + 2); promptRender(); resize(); };
$("ptop").onclick = () => { pOff = 0; promptRender(); };
window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  const sc = String((e.data.args || {}).script || "");
  if (sc !== script) { script = sc; $("ptext").textContent = script; pOff = 0; promptRender(); promptVisible(); }
});
new MutationObserver(promptVisible).observe(live, {attributes: true, attributeFilter: ["style"]});
showRate();
send("streamlit:componentReady", {apiVersion: 1});

function stopStream() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
}

function startMeter(s) {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const an = audioCtx.createAnalyser(); an.fftSize = 512;
    audioCtx.createMediaStreamSource(s).connect(an);
    const buf = new Uint8Array(an.fftSize);
    (function tick() {
      if (!audioCtx) return;
      an.getByteTimeDomainData(buf);
      let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
      $("meter").style.width = Math.min(100, peak / 128 * 250) + "%";
      requestAnimationFrame(tick);
    })();
  } catch (e) { /* garso juostelė neprivaloma */ }
}

async function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    say("Ši naršyklė neleidžia filmuoti programoje. Atidarykite nuorodą naujausioje Chrome arba Safari " +
        "(ne per Messenger ar Facebook) arba nufilmuokite video telefono kamera ir įkelkite jį.", true);
    return;
  }
  stopStream();
  say("Laukiu leidimo naudoti kamerą ir mikrofoną…");
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: facing, width: {ideal: 1280}, height: {ideal: 720}},
      audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}
    });
  } catch (e) {
    const denied = e && (e.name === "NotAllowedError" || e.name === "SecurityError");
    say(denied
      ? "Kamera ar mikrofonas neleisti. Telefono nustatymuose įjunkite naršyklei (Chrome / Safari) " +
        "kamerą ir mikrofoną, tada perkraukite puslapį ir bandykite dar kartą."
      : "Nepavyko įjungti kameros: " + (e && e.message || e), true);
    show(["start"]);
    return;
  }
  if (!stream.getAudioTracks().length) say("⚠️ Mikrofonas nerastas – video bus be garso.", true);
  else say(script ? "Kamera įjungta. Viršuje – jūsų tekstas: pradėjus filmuoti jis slinks ramiu tempu. 🐢/🐇 – lėčiau / greičiau, ⏸ – sustabdyti, A−/A+ – raidės."
                  : "Kamera įjungta. Pakalbėkite – juostelė turi judėti. Tada spauskite „Pradėti filmuoti“.");
  live.srcObject = stream; live.classList.toggle("mirror", facing === "user");
  live.style.display = "block"; playback.style.display = "none";
  $("meterRow").classList.remove("hidden"); $("timer").textContent = "";
  startMeter(stream);
  show(["rec", "flip"]);
}

function pickMime() {
  const types = ["video/mp4;codecs=avc1,mp4a", "video/mp4", "video/webm;codecs=vp9,opus",
                 "video/webm;codecs=vp8,opus", "video/webm"];
  return types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
}

function startRecording() {
  chunks = [];
  const mime = pickMime();
  try {
    recorder = new MediaRecorder(stream, Object.assign({videoBitsPerSecond: 2000000}, mime ? {mimeType: mime} : {}));
  } catch (e) { say("Nepavyko pradėti filmuoti: " + e.message, true); return; }
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = finishRecording;
  recorder.start(1000);
  t0 = Date.now();
  pOff = 0; promptStart();
  timerId = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $("timer").innerHTML = '<span class="rec">● ' + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + "</span>";
    if (s >= MAX_SECONDS) recorder.stop();
  }, 250);
  say("Filmuojama… (iki 5 min.)");
  show(["stop"]);
}

function finishRecording() {
  clearInterval(timerId);
  promptStop();
  blob = new Blob(chunks, {type: recorder.mimeType || chunks[0]?.type || "video/webm"});
  stopStream();
  live.style.display = "none"; $("meterRow").classList.add("hidden");
  playback.src = URL.createObjectURL(blob); playback.style.display = "block";
  say("Peržiūrėkite įrašą. Jei tinka – spauskite „Pridėti šį įrašą“.");
  $("again").textContent = "↩️ Filmuoti iš naujo";
  show(["use", "again"]);
}

// Įrašas siunčiamas dalimis: Streamlit Cloud didelių žinučių neperduoda. Kiekvieną dalį studija patvirtina.
const CHUNK = 256 * 1024;  // base64 ~340 KB; ~512 KB ir didesnės žinutės nepereina (patikrinta)
let sentId = null, shownId = null, nChunks = 0, curIdx = -1, retryTimer = null, sending = false;

function sendChunk(i) {
  curIdx = i;
  const reader = new FileReader();
  reader.onload = () => {
    const url = String(reader.result);
    const data = url.slice(url.indexOf("base64,") + 7);
    send("streamlit:setComponentValue", {dataType: "json",
      value: {id: sentId, mime: blob.type, idx: i, total: nChunks, data}});
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => { if (sending && curIdx === i) sendChunk(i); }, 25000);  // pasimetė – kartojam
  };
  reader.readAsDataURL(blob.slice(i * CHUNK, (i + 1) * CHUNK));
}

function useRecording() {
  sentId = Date.now(); nChunks = Math.max(1, Math.ceil(blob.size / CHUNK)); sending = true;
  say("⏳ Siunčiu įrašą studijai… 0 %");
  show([]);
  sendChunk(0);
}

// Studijos atsakymai: kiek dalių gauta ir ar įrašas priimtas
window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  const st = (e.data.args || {}).status;
  if (!st || st.id !== sentId) return;
  if (st.ok === undefined) {  // dalis gauta – siunčiam kitą
    if (st.got === curIdx && curIdx + 1 < nChunks) {
      say("⏳ Siunčiu įrašą studijai… " + Math.round((curIdx + 1) / nChunks * 100) + " %");
      sendChunk(curIdx + 1);
    } else if (st.got === nChunks - 1) {
      say("⏳ Studija tikrina įrašą…");
    }
    return;
  }
  if (st.id === shownId) return;
  shownId = st.id; sending = false; clearTimeout(retryTimer);
  if (st.ok) {
    say("✅ Įrašas pridėtas – jį matote žemiau. Galite nufilmuoti dar vieną arba viršuje spausti „Peržiūra“.");
  } else {
    say("⚠️ " + (st.msg || "Įrašo nepavyko pridėti.") + " Pabandykite dar kartą arba įkelkite video iš galerijos.", true);
  }
  $("again").textContent = "🎥 Filmuoti kitą įrašą";
  show(["again"]);
});

$("start").onclick = openCamera;
$("again").onclick = openCamera;
$("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; openCamera(); };
$("rec").onclick = startRecording;
$("stop").onclick = () => recorder && recorder.state !== "inactive" && recorder.stop();
$("use").onclick = useRecording;
show(["start"]);
</script>
</body>
</html>
