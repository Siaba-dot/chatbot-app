# Paleidimas: docker compose up -d --build   (adresas – .env faile: DOMAIN=...)
services:
  studija:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - studija-data:/data
      - ./secrets.toml:/root/.streamlit/secrets.toml:ro
  caddy:  # HTTPS „vartai“: automatinis Let's Encrypt sertifikatas
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - studija
volumes:
  studija-data:
  caddy-data:
  caddy-config:
