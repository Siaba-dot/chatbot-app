# Paleidimas: docker compose up -d --build   (adresas – .env faile: DOMAIN=...)
services:
  studija:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - studija-data:/data
      - ./secrets.toml:/root/.streamlit/secrets.toml:ro
  api:  # naujos naršyklės programos API (https://DOMAIN/api/docs) – tas pats video variklis ir duomenys
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "api.server:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment:
      - REELS_API_WORKERS=1
    volumes:
      - studija-data:/data
      - ./secrets.toml:/root/.streamlit/secrets.toml:ro
  caddy:  # HTTPS „vartai“: automatinis Let's Encrypt sertifikatas
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - studija
      - api
volumes:
  studija-data:
  caddy-data:
  caddy-config:
