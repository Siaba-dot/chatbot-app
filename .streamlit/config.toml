[server]
# Telefonuose (ypač iPhone Safari) Streamlit Cloud blokuoja įkėlimą dėl XSRF slapukų
# – be šio nustatymo video įkėlimas telefone tyliai nepavyksta.
enableXsrfProtection = false
enableCORS = false
# Telefonu filmuoti video būna dideli (MB)
maxUploadSize = 400

[browser]
gatherUsageStats = false

[theme]
# Prabangi tamsi tema su auksu (Reels studija ir montažas)
base = "dark"
primaryColor = "#D4AF37"
backgroundColor = "#0B0B0C"
secondaryBackgroundColor = "#17161A"
textColor = "#EDE6D6"
