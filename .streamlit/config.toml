[server]
# Telefonuose (ypač iPhone Safari) Streamlit Cloud blokuoja įkėlimą dėl XSRF slapukų
# – be šio nustatymo video įkėlimas telefone tyliai nepavyksta.
enableXsrfProtection = false
enableCORS = false
# Telefonu filmuoti video būna dideli (MB)
maxUploadSize = 400

[browser]
gatherUsageStats = false

[theme]
# Prabangi tamsi Baltijos gintaro tema (Reels studija ir montažas)
base = "dark"
primaryColor = "#E39B2E"
backgroundColor = "#061226"
secondaryBackgroundColor = "#0E2242"
textColor = "#F3E7D3"
