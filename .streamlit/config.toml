[server]
# Telefonuose (ypač iPhone Safari) Streamlit Cloud blokuoja įkėlimą dėl XSRF slapukų
# – be šio nustatymo video įkėlimas telefone tyliai nepavyksta.
enableXsrfProtection = false
enableCORS = false
# Telefonu filmuoti video būna dideli (MB)
maxUploadSize = 400

[browser]
gatherUsageStats = false

[theme]
# Firminė tema „Baltijos gintaras“: naktinė mėlyna su gintaru
base = "dark"
primaryColor = "#E0A43A"
backgroundColor = "#0E1420"
secondaryBackgroundColor = "#18213A"
textColor = "#F3EBDD"
